{{ define "main" }}<section class="wrap listing"><div class="sectionnum">// THE FIELD NOTES</div><h1>Archive<span class="green">.</span></h1><p>All stories, notes and writeups.</p>{{ range (where site.RegularPages "Section" "posts").ByDate.Reverse }}<article class="entry"><div class="tag">{{ .Date.Format "02 Jan 2006" }} &nbsp; / &nbsp; {{ .ReadingTime }} MIN READ</div><h2><a href="{{ .RelPermalink }}">{{ .Title }} ↗</a></h2><p>{{ .Description }}</p></article>{{ end }}</section>{{ end }}
